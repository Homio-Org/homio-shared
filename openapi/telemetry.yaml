# OpenAPI fragment: Telemetry schema
# Include via $ref from your main API spec, e.g. openapi/telemetry.yaml#/components/schemas/Telemetry

components:
  schemas:
    Telemetry:
      type: object
      description: Device telemetry payload published to MQTT
      properties:
        temperature:
          type: number
          description: Temperature in Celsius
        humidity:
          type: number
          description: Relative humidity in percent (0–100)
        sound_level:
          type: number
          description: Sound level (e.g. dB)
        illuminance:
          type: number
          description: Illuminance in lux
        co2:
          type: number
          description: CO2 concentration in ppm
        motion:
          type: boolean
          description: Motion detected
        ts:
          type: string
          format: date-time
          description: ISO 8601 timestamp of the reading
        battery:
          type: number
          description: Battery level (e.g. 0–100 percent or voltage)
        metrics:
          type: object
          description: Generic metrics map for integrations that send dynamic keys
          additionalProperties:
            oneOf:
              - type: number
              - type: boolean
              - type: string
        points:
          type: array
          description: Optional list representation for arbitrary metrics
          items:
            type: object
            required: [key, value]
            properties:
              key:
                type: string
              value:
                type: number
              unit:
                type: string
            additionalProperties: false
        deviceId:
          type: string
          description: Source device identifier
        houseId:
          type: string
          description: Source house identifier
      additionalProperties: true
